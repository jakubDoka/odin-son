[package]
name = "bac"
version = "0.1.2"
edition = "2024"
description = "Rust bindings for the BAC compiler backend"
build = "build.rs"
links = "bac"
license = "MPL-2.0"
repository = "https://github.com/jakubDoka/odin-son.git"
readme = "../../../README.md"
include = ["lib/**", "examples/**", "src/**", "build.rs"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[features]
default = []
alloc = []

[dependencies]
